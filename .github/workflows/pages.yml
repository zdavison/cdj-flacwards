# Build the patcher page and deploy it to GitHub Pages. The page holds our
# release blob and the manifest, never firmware. Deployment needs Pages
# enabled with the source "GitHub Actions", and a public repository (or a
# paid plan); until then the job builds the site only.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev texinfo
      - name: Restore the SH-4 toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/build-toolchain.sh') }}
      - name: Build the SH-4 toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/build-toolchain.sh
      - name: Add the toolchain to PATH
        run: echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"
      - name: Build the site
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
