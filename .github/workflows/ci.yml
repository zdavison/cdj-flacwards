# Tests that need no firmware. The firmware-dependent tools (build_patch.py,
# the emulator runs) are not run here, because this repository holds no
# firmware.
name: CI

on:
  push:
  pull_request:

jobs:
  host:
    name: PC tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac
      - name: Run the PC tests
        run: make test-host

  target:
    name: SH-4 build, ABI checks and all tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev texinfo \
            qemu-user-static ffmpeg flac
      - name: Restore the SH-4 toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ runner.os }}-${{ hashFiles('tools/build-toolchain.sh') }}
      - name: Build the SH-4 toolchain (binutils and GCC, about 20 minutes)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/build-toolchain.sh
      - name: Add the toolchain to PATH
        run: echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"
      - name: Build the debug and release blobs
        run: make
      - name: Check the calling convention (MACH/MACL, no FPU)
        run: make check-abi
      - name: Run all tests (including the SH-4 ABI test in qemu-sh4-static)
        run: make test
